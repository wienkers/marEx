[build-system]
requires = ["setuptools>=77.0", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marEx"
authors = [
    {name = "Aaron Wienkers", email = "aaron@wienkers.com"},
]
description = "Scalable detection and tracking of extremes in weather and climate data"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "climate extremes",
    "weather extremes",
    "anomalies",
    "climatology",
    "detrending",
    "heatwaves",
    "drought",
    "event tracking",
    "xarray",
    "dask",
    "hpc",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "xarray[complete]",
    "dask[complete]>=2025.9.0",
    "netcdf4",
    "zarr>=2.18",
    "scipy",
    "scikit-image",
    "dask_image",
    "pandas",
    "numba",
    "pillow",
    "xhistogram",
    "flox>=0.10.1",
    "matplotlib",
    "cartopy",
]

[project.optional-dependencies]
# Minimal installation (core anomaly, detection and tracking)
minimal = []

# Performance optimisation dependencies
performance = [
    "jax",
    "jaxlib",
]

# High-performance computing cluster support
hpc = [
    "dask_jobqueue",
    "psutil",
]

# Visualisation and plotting
plotting = [
    "seaborn>=0.11.0",
    "cmocean",
    "cartopy",
    "matplotlib>=3.5.0",
    "ffmpeg",
]

# Full installation (all optional dependencies)
full = [
    "jax",
    "jaxlib",
    "dask_jobqueue",
    "seaborn>=0.11.0",
    "cmocean",
    "ffmpeg",
]

# Development tools
dev = [
    "ruff",
    "pre-commit>=2.20.0",
    "pytest>=7.0.0",
    "pytest-cov",
    "pytest-xdist",
    "coverage[toml]>=6.0.0",
    "psutil",
    "jupyter",
    "ipykernel",
]

# Documentation building
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "nbsphinx",
    "pandoc",
    "sphinxcontrib-video",
]

# Testing framework
test = [
    "pytest>=7.0.0",
    "pytest-cov",
    "pytest-xdist",
    "coverage[toml]>=6.0.0",
    "psutil",
]

[project.urls]
"Homepage" = "https://github.com/wienkers/marEx"
"Bug Tracker" = "https://github.com/wienkers/marEx/issues"

[tool.setuptools.packages.find]
include = ["marEx*"]
namespaces = false

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.ruff]
line-length = 132
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "D"]
ignore = [
    "E203",
    "E402",
    "D205",
    "D400",
    # Fire on existing code (counts at adoption); fixing is out of scope.
    "B905",  # zip() without strict=: 53
    "C420",  # dict comprehension for iterable: 14
    "C408",  # dict()/list() call: 3
    "B904",  # raise without from inside except: 3
    "B018",  # useless expression: 2 (1 py, 1 notebook)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D"]
# Notebooks were never flake8-linted (only black/isort via nbqa): keep them format-only on these
"*.ipynb" = ["D", "E501", "F401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["marEx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--tb=short",
    "--strict-markers",
    # The larger-than-memory tests run in their own CI job; an explicit -m on the command line wins.
    "-m",
    "not larger_than_memory",
]
log_cli_level = "WARNING"
log_cli_format = "%(levelname)s %(name)s: %(message)s"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmark tests",
    "nocov: marks tests to be excluded from coverage reporting",
    "numba_issue: marks tests that have Numba compatibility issues with coverage",
    "smoke: fast end-to-end checks run against the built wheel in CI ('-m smoke')",
    "larger_than_memory: inputs larger than the test cluster's summed worker memory",
]

[tool.coverage.run]
source = ["marEx"]
parallel = true  # Enable parallel coverage collection
concurrency = ["thread", "multiprocessing"]  # Handle both threads and processes
sigterm = true  # Handle SIGTERM gracefully
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/_coverage_init.py",
    "*/_dependencies.py",
    "*/plotX/unstructured.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@jit",
    "@njit",
    "@numba\\.jit",
    "@numba\\.njit",
    "@numba\\.vectorize",
    "@numba\\.guvectorize",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "except ImportError:",
    "except (ImportError, ValueError):",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"
