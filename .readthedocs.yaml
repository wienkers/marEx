# Read the Docs configuration file for marEx
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  # pandoc is required by nbsphinx to render the example notebooks
  apt_packages:
    - pandoc
  jobs:
    pre_install:
      - pip install --upgrade pip setuptools wheel

# Build the HTML documentation with Sphinx
sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: false

# Install marEx (with full optional deps) plus the doc-build toolchain
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - full
    - requirements: docs/requirements-docs.txt

# Configure search ranking
search:
  ranking:
    api/: -1
    _autosummary/: -2
    generated/: -2
  ignore:
    - "_build/*"
    - "_static/*"
    - "_templates/*"

# HTML only: PDF/EPUB LaTeX builds are fragile with image-heavy notebooks.
formats: []
