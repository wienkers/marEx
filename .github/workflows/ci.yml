name: CI

on:
  push:
    branches: [main, v4D_beta, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        shell: bash
        run: |
          python -m pip install --upgrade pip pre-commit
          pre-commit run --all-files --show-diff-on-failure
      - name: Unit-test the release check script
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest .github/scripts -q

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,full]"
          pip list
      - name: Run tests
        shell: bash
        run: |
          python -m pytest -n 2 -m "not larger_than_memory" --durations=25 --junitxml=junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            **/*.log
            /tmp/pytest-of-runner/pytest-current/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check
        shell: bash
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke:
    name: Smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the wheel into a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then
            echo "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install wheel and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl pytest pytest-xdist psutil
          pip check
      - name: Test the installed wheel, not the checkout
        shell: bash
        run: |
          rm -rf marEx
          python -c "import marEx; print(marEx.__file__); assert 'site-packages' in marEx.__file__, marEx.__file__"
          python -m pytest -m smoke -q
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ matrix.os }}-${{ matrix.python-version }}
          path: "**/*.log"
          if-no-files-found: ignore
          retention-days: 7

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements-docs.txt
      - name: Install pandoc
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ".[full]" -r docs/requirements-docs.txt
      - name: Build HTML
        shell: bash
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  larger-than-memory:
    # Required in ci-ok: green on three consecutive runner runs (shapes confirmed there).
    name: Larger than memory
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,full]"
          pip list
      - name: Disk and memory
        shell: bash
        run: |
          df -h
          free -h
          nproc
      - name: Run larger-than-memory tests
        shell: bash
        run: |
          python -m pytest -m larger_than_memory -v -s --durations=0 --junitxml=junit-ltm.xml 2>&1 | tee pytest-ltm.log
          exit "${PIPESTATUS[0]}"
      - name: Disk at job end
        if: always()
        shell: bash
        run: df -h
      - name: Upload pytest logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: larger-than-memory-logs
          path: |
            pytest-ltm.log
            junit-ltm.xml
          if-no-files-found: ignore
          retention-days: 7

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, larger-than-memory, build, smoke, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done
