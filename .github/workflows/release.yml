name: Release

# A `v*` tag publishes to PyPI once ci.yml's `CI OK` job has passed on the tagged commit on main.
# workflow_dispatch is a DRY RUN: it validates `version` and runs the CI check on `sha`; every job
# that builds, publishes or releases is restricted to tag pushes and is skipped.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA to run the CI check on"
        required: true
        type: string
      version:
        description: "Version to validate, e.g. 5.0.0rc0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Parse the version
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --upgrade packaging
          if [ "$EVENT" = "push" ]; then
            case "$REF" in
              refs/tags/v*) RAW="${REF#refs/tags/v}" ;;
              *) echo "not a v* tag: $REF"; exit 1 ;;
            esac
          else
            RAW="$INPUT_VERSION"
          fi
          RAW="$RAW" python - <<'PY'
          import os
          from packaging.version import InvalidVersion, Version

          raw = os.environ["RAW"]
          try:
              v = Version(raw)
          except InvalidVersion:
              raise SystemExit(f"not a valid version: {raw!r}")
          if v.local:
              raise SystemExit(f"a release version has no local segment: {raw!r}")
          print(f"version {raw!r} -> {v.public}, prerelease={v.is_prerelease}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={v.public}\n")
              fh.write(f"is_prerelease={str(v.is_prerelease).lower()}\n")
          PY

  ci-check:
    name: CI check
    needs: validate
    runs-on: ubuntu-latest
    # The check polls for 90 min: ci.yml's own test job may take its full 75 min timeout, smoke runs
    # after build, and the runners can queue. This job's timeout sits above that deadline + 2 min
    # grace, so the check prints its verdict before the runner kills it.
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    steps:
      # The workflow's own ref: the tag on push, the dispatched branch on a dry run, so the check
      # script always comes from the release.yml that is running.
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require a green ci.yml push run on main for this commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            SHA="$(git rev-parse HEAD)"
          else
            SHA="$INPUT_SHA"
            if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "inputs.sha must be a full 40-character lowercase commit SHA, got '$SHA'"
              exit 1
            fi
          fi
          echo "checking commit $SHA"
          python .github/scripts/ci_check.py --repo "$REPO" --sha "$SHA" --deadline 5400 --grace 120

  build:
    name: Build
    needs: [validate, ci-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check
        shell: bash
        env:
          EXPECTED: ${{ needs.validate.outputs.version }}
        run: |
          python -m pip install --upgrade pip build twine packaging
          python -m build
          twine check dist/*
          ls -la dist
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.version import Version

          expected = os.environ["EXPECTED"]
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)
          built = {str(Version(wheels[0].name.split("-")[1])), str(Version(sdists[0].name[: -len(".tar.gz")].rsplit("-", 1)[1]))}
          assert built == {expected}, f"built version(s) {sorted(built)} != tag version {expected}"
          print(f"built version {expected} matches the tag")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  install-check:
    name: Install check (${{ matrix.os }}, py3.12)
    needs: build
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create a clean venv outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then
            echo "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install the wheel and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl pytest pytest-xdist psutil
          pip check
      - name: Test the installed wheel, not the checkout
        shell: bash
        run: |
          rm -rf marEx
          python -c "import marEx; print(marEx.__file__); assert 'site-packages' in marEx.__file__, marEx.__file__"
          python -m pytest -m smoke -q
      - name: Install the sdist into a second venv and test it (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv-sdist"
          SDIST_PY="$RUNNER_TEMP/venv-sdist/bin/python"
          "$SDIST_PY" -m pip install --upgrade pip
          "$SDIST_PY" -m pip install dist/*.tar.gz pytest pytest-xdist psutil
          "$SDIST_PY" -m pip check
          "$SDIST_PY" -c "import marEx, sys; print(marEx.__file__); assert marEx.__file__.startswith(sys.prefix), marEx.__file__"
          "$SDIST_PY" -m pytest -m smoke -q
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-check-logs-${{ matrix.os }}
          path: "**/*.log"
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [validate, ci-check, build, install-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/marEx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  github-release:
    name: GitHub release
    needs: [validate, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Extract the CHANGELOG.md section for this version
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY' > release-notes.md
          import os
          import re

          version = os.environ["VERSION"]
          heading = re.compile(rf"^## \[?v?{re.escape(version)}\]?(\s|$)")
          section, inside = [], False
          with open("CHANGELOG.md", encoding="utf-8") as fh:
              for line in fh:
                  if line.startswith("## "):
                      if inside:
                          break
                      inside = bool(heading.match(line))
                      continue
                  if inside:
                      section.append(line)
          body = "".join(section).strip()
          if body:
              print(body)
          else:
              print(f"CHANGELOG.md has no section for {version}.")
          PY
          cat release-notes.md
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          FLAGS=(--verify-tag --title "$TAG" --notes-file release-notes.md --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" dist/* "${FLAGS[@]}"
