# Codecov configuration for marEx
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    # Report only; no pass/fail threshold on coverage
    project:
      default:
        informational: true
    patch: off

# Comment configuration
comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Ignore paths
ignore:
  - "tests/"
  - "docs/"
  - "examples/"
  - "setup.py"
  - "**/_dependencies.py"
  - "**/_coverage_init.py"
  - "**/plotX/unstructured.py"
